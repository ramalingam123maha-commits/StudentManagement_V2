<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Task Manager</h1>
            <p>Organize your tasks by priority</p>
        </header>

        <main class="app-main">
            <!-- Add task form -->
            <form id="taskForm" class="task-form" autocomplete="off">
                <div class="form-row">
                    <input
                        type="text"
                        id="taskInput"
                        class="task-input"
                        placeholder="What needs to be done?"
                        maxlength="120"
                        required
                    >
                    <select id="prioritySelect" class="priority-select" aria-label="Task priority">
                        <option value="high">High</option>
                        <option value="medium" selected>Medium</option>
                        <option value="low">Low</option>
                    </select>
                    <button type="submit" class="add-btn">Add Task</button>
                </div>
                <span class="input-error" id="inputError"></span>
            </form>

            <!-- Filters -->
            <div class="filter-bar" id="filterBar">
                <div class="filters">
                    <button type="button" class="filter-btn active" data-filter="all">All</button>
                    <button type="button" class="filter-btn" data-filter="high">High</button>
                    <button type="button" class="filter-btn" data-filter="medium">Medium</button>
                    <button type="button" class="filter-btn" data-filter="low">Low</button>
                </div>
                <span class="task-count" id="taskCount">0 tasks</span>
            </div>

            <!-- Task list -->
            <ul id="taskList" class="task-list" aria-live="polite"></ul>

            <!-- Empty state -->
            <div id="emptyState" class="empty-state">
                <p>No tasks yet. Add your first task above!</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>

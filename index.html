<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="login-wrapper">
            <div class="login-box">
                <h1 class="logo">StudentHub</h1>
                <h2 class="title">Student Management System</h2>
                
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your email" 
                            required
                        >
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Enter your password" 
                                required
                            >
                            <button type="button" class="toggle-password" id="togglePassword">
                                <span class="eye-icon">👁️</span>
                            </button>
                        </div>
                        <span class="error-message" id="passwordError"></span>
                    </div>

                    <div class="form-group checkbox">
                        <input 
                            type="checkbox" 
                            id="rememberMe" 
                            name="rememberMe"
                        >
                        <label for="rememberMe">Remember me</label>
                    </div>

                    <button type="submit" class="btn-login">Login</button>
                </form>

                <div class="form-footer">
                    <p>Don't have an account? <a href="#signup" class="link-signup">Sign up here</a></p>
                    <p><a href="#forgot" class="link-forgot">Forgot your password?</a></p>
                </div>

                <div class="demo-credentials">
                    <p class="demo-title">Demo Credentials:</p>
                    <p><strong>Email:</strong> student@example.com</p>
                    <p><strong>Password:</strong> password123</p>
                </div>

                <div class="success-message" id="successMessage">
                    <span class="success-icon">✓</span>
                    <span id="successText"></span>
                </div>
            </div>

            <div class="login-image">
                <div class="image-content">
                    <div class="illustration">
                        <div class="circle circle-1"></div>
                        <div class="circle circle-2"></div>
                        <div class="circle circle-3"></div>
                    </div>
                    <h3>Welcome Back!</h3>
                    <p>Manage your academic journey with ease</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
